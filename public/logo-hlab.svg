<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" role="img" aria-label="HLAB">
  <!-- Mark: node cluster (lab / global network), one green node -->
  <g transform="translate(8,12)">
    <rect width="40" height="40" rx="11" fill="#1d1d1f"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
      <line x1="13" y1="16" x2="29" y2="13"/>
      <line x1="29" y1="13" x2="20" y2="30"/>
      <line x1="13" y1="16" x2="20" y2="30"/>
    </g>
    <circle cx="13" cy="16" r="2.4" fill="#ffffff"/>
    <circle cx="20" cy="30" r="2.4" fill="#ffffff"/>
    <circle cx="29" cy="13" r="4.2" fill="#34c759" fill-opacity="0.18"/>
    <circle cx="29" cy="13" r="3.1" fill="#34c759"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="33" font-weight="700" letter-spacing="-1.4" fill="#1d1d1f">HLAB</text>
</svg>
